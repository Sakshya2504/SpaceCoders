<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7A68F2"/>
      <stop offset="1" stop-color="#5141C8"/>
    </linearGradient>
  </defs>

  <!-- Rounded clinical shield keeps the mark readable at favicon size. -->
  <rect width="64" height="64" rx="16" fill="#0B1220"/>
  <path d="M32 8L49 14V29C49 40.3 42.1 50.1 32 55C21.9 50.1 15 40.3 15 29V14L32 8Z" fill="url(#bg)"/>

  <!-- Medical cross communicates the healthcare purpose without tiny text. -->
  <rect x="28" y="18" width="8" height="27" rx="4" fill="white"/>
  <rect x="18" y="27.5" width="28" height="8" rx="4" fill="white"/>

  <!-- Small status dot reflects the product's live-monitoring identity. -->
  <circle cx="48" cy="16" r="5" fill="#27C79A" stroke="#0B1220" stroke-width="2"/>
</svg>
